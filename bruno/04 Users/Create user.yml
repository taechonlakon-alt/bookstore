info:
  name: Create user
  type: http
  seq: 26

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"
  body:
    type: json
    data: |-
      {
        "user": {
          "email": "bruno-{{runId}}@example.com",
          "role": "user"
        }
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // process.env interpolation ({{process.env.X}}) only works in request
        // fields, not in scripts, so set the password here with getProcessEnv.
        // Doing it in a script also keeps a literal password JSON key out of
        // committed files. The value comes from the git-ignored bruno/.env.
        const body = req.getBody();
        const password = bru.getProcessEnv("USER_PASSWORD");
        body.user.password = password;
        body.user.password_confirmation = password;
        req.setBody(body);
    - type: after-response
      code: bru.setVar("userId", res.body.id);
    - type: tests
      code: |-
        test("returns 201", function () {
          expect(res.status).to.equal(201);
        });

        test("returns the new user", function () {
          expect(res.body.email).to.equal("bruno-" + bru.getVar("runId") + "@example.com");
          expect(res.body.role).to.equal("user");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Success: an admin creates a user. Saves its id in `userId`."
