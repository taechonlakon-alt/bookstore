info:
  name: Delete user
  type: http
  seq: 29

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("confirms the delete", function () {
          expect(res.body.message).to.equal("User deleted");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Success: an admin deletes the user created above."
