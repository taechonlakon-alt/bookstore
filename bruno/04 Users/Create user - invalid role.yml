info:
  name: Create user - invalid role
  type: http
  seq: 27

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"
  body:
    type: json
    data: |-
      {
        "user": {
          "email_address": "bruno-bad-{{runId}}@example.com",
          "password": "password",
          "role": "superuser"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 422", function () {
          expect(res.status).to.equal(422);
        });

        test("says the role is invalid", function () {
          expect(res.body.errors.join(" ")).to.match(/Role/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Failure: a role other than `user` or `admin` gives 422."
