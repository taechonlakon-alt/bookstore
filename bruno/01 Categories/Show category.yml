info:
  name: Show category
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/categories/{{categoryId}}"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("returns the category that was created", function () {
          expect(res.body.id).to.equal(bru.getVar("categoryId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Success: shows the category created earlier in this run."
