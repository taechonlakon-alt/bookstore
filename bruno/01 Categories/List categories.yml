info:
  name: List categories
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/categories"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Books are created in an existing category, so remember one.
        bru.setVar("existingCategoryId", res.body[0].id);
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("returns an array", function () {
          expect(res.body).to.be.an('array').that.is.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Success: lists every category."
