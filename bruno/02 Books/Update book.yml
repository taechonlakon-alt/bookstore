info:
  name: Update book
  type: http
  seq: 16

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/books/{{bookId}}"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"
  body:
    type: json
    data: |-
      {
        "book": {
          "title": "Bruno Book {{runId}} (edited)"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("returns the updated values", function () {
          expect(res.body.title).to.match(/\(edited\)$/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Success: an admin updates the book."
