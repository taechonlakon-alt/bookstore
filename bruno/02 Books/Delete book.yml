info:
  name: Delete book
  type: http
  seq: 17

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/books/{{bookId}}"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("confirms the delete", function () {
          expect(res.body.message).to.match(/deleted/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Success: an admin deletes the book. This also cleans up the data this run created."
