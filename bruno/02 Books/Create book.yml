info:
  name: Create book
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/v1/books"
  headers:
    - name: Cookie
      value: "{{adminCookie}}"
  body:
    type: json
    data: |-
      {
        "book": {
          "title": "Bruno Book {{runId}}",
          "author": "Bruno",
          "description": "Created by the Bruno tests",
          "category_id": "{{existingCategoryId}}"
        }
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("bookId", res.body.id);
    - type: tests
      code: |-
        test("returns 201", function () {
          expect(res.status).to.equal(201);
        });

        test("returns the new book", function () {
          expect(res.body.title).to.equal("Bruno Book " + bru.getVar("runId"));
          expect(res.body.category.id).to.equal(Number(bru.getVar("existingCategoryId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Success: an admin creates a book. Saves its id in `bookId`."
